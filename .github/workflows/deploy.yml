name: Deploy Job Portal to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-portal-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy with Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deployment files
        run: |
          test -f docker-compose.yml || {
            echo "docker-compose.yml not found at repository root"
            exit 1
          }

      - name: Copy project to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,Job_Portal_System_Django-React-main"
          target: "/home/ubuntu/job_portal"
          overwrite: true
          command_timeout: 10m
          exclude: "**/node_modules/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/.git/**"

      - name: Build and deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -eu

            echo "Installing Docker if required..."

            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose-v2
            fi

            sudo systemctl enable --now docker

            if ! sudo docker compose version >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker-compose-v2
            fi

            cd /home/ubuntu/job_portal

            echo "Validating Docker Compose..."
            sudo docker compose -f docker-compose.yml config -q

            echo "Building backend and frontend..."
            sudo docker compose -f docker-compose.yml build

            echo "Starting application..."
            sudo docker compose -f docker-compose.yml up -d --remove-orphans

            echo "Container status:"
            sudo docker compose -f docker-compose.yml ps

            echo "Recent logs:"
            sudo docker compose -f docker-compose.yml logs --tail=50

            echo "Deployment finished."

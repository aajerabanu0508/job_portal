name: Deploy Job Portal to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-portal-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy with Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deployment files
        run: |
          test -f docker-compose.yml || {
            echo "docker-compose.yml not found at repository root"
            exit 1
          }

      - name: Copy project to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,Job_Portal_System_Django-React-main"
          target: "/home/ubuntu/job_portal"
          overwrite: true
          command_timeout: 10m
          exclude: "**/node_modules/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/.git/**"

      - name: Build and deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -eu

            echo "Checking Docker and Docker Compose..."

            if ! command -v docker >/dev/null 2>&1; then
              echo "Installing Docker using official installer..."
              curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
              sudo sh /tmp/get-docker.sh
              rm -f /tmp/get-docker.sh
            fi

            sudo systemctl enable --now docker

            if ! sudo docker compose version >/dev/null 2>&1; then
              echo "Installing Docker Compose CLI plugin..."
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              COMPOSE_VERSION=$(curl -s https://api.github.com/repos/docker/compose/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' || echo "v2.29.7")
              COMPOSE_VERSION=${COMPOSE_VERSION:-v2.29.7}
              ARCH=$(uname -m)
              case $ARCH in
                x86_64) COMPOSE_ARCH="x86_64" ;;
                aarch64|arm64) COMPOSE_ARCH="aarch64" ;;
                *) COMPOSE_ARCH="x86_64" ;;
              esac
              sudo curl -sSL "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-${COMPOSE_ARCH}" -o /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            fi

            cd /home/ubuntu/job_portal

            # Ensure backend .env exists
            if [ ! -f "Job_Portal_System_Django-React-main/backend/.env" ] && [ -f "Job_Portal_System_Django-React-main/backend/.env.example" ]; then
              echo "Generating initial backend/.env from .env.example..."
              cp Job_Portal_System_Django-React-main/backend/.env.example Job_Portal_System_Django-React-main/backend/.env
            fi

            echo "Validating Docker Compose..."
            sudo docker compose -f docker-compose.yml config -q

            echo "Building backend and frontend..."
            sudo docker compose -f docker-compose.yml build

            echo "Starting application..."
            sudo docker compose -f docker-compose.yml up -d --remove-orphans

            echo "Container status:"
            sudo docker compose -f docker-compose.yml ps

            echo "Recent logs:"
            sudo docker compose -f docker-compose.yml logs --tail=50

            echo "Deployment finished."

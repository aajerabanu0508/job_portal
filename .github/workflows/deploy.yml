
name: Deploy Job Portal to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-portal-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Amazon Linux EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deployment files
        run: |
          test -f docker-compose.yml
          test -d Job_Portal_System_Django-React-main/backend
          test -d Job_Portal_System_Django-React-main/frontend

      - name: Copy project to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,Job_Portal_System_Django-React-main"
          target: "/home/ec2-user/job_portal"
          overwrite: true
          command_timeout: 10m
          exclude: "**/node_modules/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/.git/**"

      - name: Build and deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -eu

            cd /home/ec2-user/job_portal

            if ! command -v docker >/dev/null 2>&1; then
              sudo dnf install -y docker
            fi

            sudo systemctl enable --now docker

            if ! sudo docker compose version >/dev/null 2>&1; then
              sudo mkdir -p /usr/local/lib/docker/cli-plugins

              VERSION=$(curl -fsSL \
                https://api.github.com/repos/docker/compose/releases/latest \
                | grep '"tag_name":' \
                | head -1 \
                | sed -E 's/.*"([^"]+)".*/\1/')

              ARCH=$(uname -m)
              case "$ARCH" in
                x86_64) COMPOSE_ARCH="x86_64" ;;
                aarch64) COMPOSE_ARCH="aarch64" ;;
                *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
              esac

              sudo curl -fsSL \
                "https://github.com/docker/compose/releases/download/${VERSION}/docker-compose-linux-${COMPOSE_ARCH}" \
                -o /usr/local/lib/docker/cli-plugins/docker-compose

              sudo chmod +x \
                /usr/local/lib/docker/cli-plugins/docker-compose
            fi

            APP_DIR="Job_Portal_System_Django-React-main"

            if [ ! -f "$APP_DIR/backend/.env" ] && \
               [ -f "$APP_DIR/backend/.env.example" ]; then
              cp "$APP_DIR/backend/.env.example" "$APP_DIR/backend/.env"
            fi

            echo "Validating Docker Compose..."
            sudo docker compose -f docker-compose.yml config -q

            echo "Building application..."
            sudo docker compose -f docker-compose.yml build

            echo "Starting application..."
            sudo docker compose -f docker-compose.yml up -d --remove-orphans

            echo "Container status:"
            sudo docker compose -f docker-compose.yml ps

            echo "Recent application logs:"
            sudo docker compose -f docker-compose.yml logs --tail=50

            echo "Deployment completed."
